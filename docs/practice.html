<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시스템 프로그래밍 중간고사 실습 타이핑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Malgun Gothic',sans-serif;background:#1e1e1e;color:#d4d4d4;display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ── */
#sidebar{width:230px;min-width:230px;background:#252526;border-right:1px solid #3c3c3c;overflow-y:auto;display:flex;flex-direction:column}
#sidebar-head{padding:12px 14px 8px;font-size:11px;color:#bbb;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #3c3c3c;flex-shrink:0}
.ch-label{padding:8px 14px 3px;font-size:11px;color:#569cd6;font-weight:bold}
.sec-btn{display:block;width:100%;padding:5px 14px 5px 22px;text-align:left;background:none;border:none;color:#ccc;font-size:12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Malgun Gothic',sans-serif}
.sec-btn:hover{background:#2a2d2e}
.sec-btn.active{background:#094771;color:#fff}
.sec-btn.done{color:#4ec94e}
.sec-btn .star{color:#f1c40f;font-size:10px}
#progress-wrap{padding:10px 14px;border-top:1px solid #3c3c3c;font-size:11px;color:#888;flex-shrink:0}
#progress-bar{height:4px;background:#3c3c3c;border-radius:2px;margin-top:5px}
#progress-fill{height:100%;background:#4ec94e;border-radius:2px;width:0;transition:width .3s}

/* ── Main ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:#2d2d30;padding:9px 18px;border-bottom:1px solid #3c3c3c;display:flex;align-items:center;gap:10px;flex-shrink:0}
#sec-title{font-size:15px;font-weight:bold;color:#eee;flex:1}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold}
.b-star{background:#2d2a00;color:#f1fa8c;border:1px solid #f1c40f}
.b-ch{background:#0d2137;color:#569cd6;border:1px solid #264f78}
#nav-btns{display:flex;gap:6px}
.nav-btn{padding:4px 10px;background:#3c3c3c;border:none;border-radius:3px;color:#ccc;cursor:pointer;font-size:12px;font-family:'Malgun Gothic',sans-serif}
.nav-btn:hover{background:#555}

/* ── Content ── */
#content{flex:1;overflow-y:auto;display:flex;flex-direction:column}
#concept-box{background:#1a1a2e;border-left:3px solid #569cd6;padding:10px 18px;font-size:12.5px;line-height:1.75;white-space:pre-wrap;color:#c8c8c8;flex-shrink:0}
.panel-hd{padding:5px 18px;background:#2d2d30;border-top:1px solid #3c3c3c;border-bottom:1px solid #3c3c3c;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#888;flex-shrink:0}
.tog-btn{padding:2px 8px;background:#3c3c3c;border:none;border-radius:3px;color:#ccc;cursor:pointer;font-size:11px;font-family:'Malgun Gothic',sans-serif}
.tog-btn:hover{background:#4a4a4a}
#ref-wrap{flex-shrink:0;overflow:hidden;transition:max-height .2s}
#ref-code{background:#141414;font-family:'Courier New',Consolas,monospace;font-size:12.5px;line-height:1.6;padding:10px 18px;white-space:pre;overflow-x:auto;color:#d4d4d4;max-height:260px;overflow-y:auto}
#quiz-box{background:#1a2a1a;border-left:3px solid #4ec94e;padding:8px 18px;font-size:12px;white-space:pre-wrap;color:#a8d8a8;flex-shrink:0;display:none}

/* ── Practice ── */
#practice{flex-shrink:0;padding:10px 18px;background:#1e1e1e;border-top:1px solid #3c3c3c;display:flex;flex-direction:column;gap:7px}
#practice-lbl{font-size:11px;color:#888}
#typing{width:100%;min-height:170px;background:#0d0d0d;color:#d4d4d4;font-family:'Courier New',Consolas,monospace;font-size:12.5px;line-height:1.6;padding:8px 12px;border:1px solid #3c3c3c;border-radius:4px;resize:vertical;outline:none;tab-size:4}
#typing:focus{border-color:#569cd6}
#actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#match-disp{font-size:13px;font-weight:bold;color:#4ec94e;min-width:70px}
#char-disp{font-size:11px;color:#666}
.abtn{padding:5px 13px;border:none;border-radius:4px;cursor:pointer;font-size:12px;font-family:'Malgun Gothic',sans-serif}
.btn-chk{background:#0e639c;color:#fff}.btn-chk:hover{background:#1177bb}
.btn-rst{background:#444;color:#ccc}.btn-rst:hover{background:#555}
.btn-ok{background:#1a5c1a;color:#4ec94e;border:1px solid #4ec94e}.btn-ok:hover{background:#236b23}
.btn-nxt{background:#373737;color:#ccc}.btn-nxt:hover{background:#454545}
#diff-box{display:none;background:#0d0d0d;border:1px solid #444;border-radius:4px;padding:8px 12px;font-family:'Courier New',Consolas,monospace;font-size:12.5px;line-height:1.6;max-height:160px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.d-ok{color:#4ec94e}.d-err{color:#ff6b6b;background:#3a0000}.d-mis{color:#666;background:#2a2a00;text-decoration:underline}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#1e1e1e}
::-webkit-scrollbar-thumb{background:#555;border-radius:3px}
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-head">📋 섹션 목록</div>
  <div id="sec-list"></div>
  <div id="progress-wrap">
    <span id="prog-text">0 / 0 완료</span>

    <div class="panel-hd">

        <span id="char-disp">0 / 0 자</span>
        <button class="abtn btn-chk" onclick="checkDiff()">🔍 비교하기</button>
        <button class="abtn btn-rst" onclick="resetTyping()">↺ 다시 쓰기</button>
        <button class="abtn btn-ok" onclick="markDone()">✓ 완료 표시</button>
        <button class="abtn btn-nxt" onclick="navigate(1)">다음 섹션 →</button>

<script>
// ─────────────────────────────────────────────────────────────────

const SECTIONS = [
{
  id:"CH3-0", ch:"3장", star:false,
  title:"AddTwoProgram — 교재 첫 예제",
  concept:
`교재에서 처음 등장하는 최소 MASM 프로그램 구조입니다.

어셈블-링크-실행 사이클:
  .asm → [Assembler] → .obj → [Linker + .lib] → .exe → OS Loader → 실행

디렉티브 vs 명령어:
  디렉티브 → 어셈블 시간만 처리, 기계어 생성 없음  (예: .DATA, DWORD, PROC)
  명령어   → 기계어로 번역, 런타임에 CPU가 실행      (예: mov, add, loop)

★ 세 변수 합산 패턴 핵심:
  x86은 메모리↔메모리 직접 연산 불가 → 반드시 레지스터를 중간에 사용!`,
  code:
`.386
.MODEL flat, stdcall
.STACK 4096
ExitProcess PROTO, dwExitCode:DWORD

.DATA
    val1 DWORD 10000h
    val2 DWORD 40000h
    val3 DWORD 20000h
    sum  DWORD 0

.CODE
main PROC
    ; 5 + 6 = 11
    mov eax, 5
    add eax, 6           ; EAX = 11

    ; 세 변수 합산 (레지스터 경유 필수)
    mov eax, val1        ; EAX = 10000h
    add eax, val2        ; EAX = 50000h
    add eax, val3        ; EAX = 70000h
    mov sum, eax         ; sum = 70000h

    INVOKE ExitProcess, 0
main ENDP
END main`,
  quiz: null
},
{
  id:"CH3-2", ch:"3장", star:false,
  title:"정수 리터럴 / 상수 표현식 / 문자열 리터럴",
  concept:
`★ 정수 리터럴 진법 표기
  10진수: 26  또는  26d
  16진수: 1Ah,  0FFh  ← A~F로 시작하면 반드시 앞에 0 붙임!
  2진수:  1101b
  8진수:  36o

  오류 예) FFh, A3h   올바름) 0FFh, 0A3h

★ 상수 정수 표현식 (어셈블 시간에만 평가)
  연산자 우선순위: () > 단항 +/- > * / MOD > 이항 +/-
  expr1 DWORD  16 * 20          ; = 320
  expr2 DWORD  (5 + 3) * 2 - 1  ; = 15
  expr3 DWORD  17 MOD 5          ; = 2  (나머지)

★ 문자열 리터럴
  str2 BYTE "ABCD", 0           ; 널 종료 (5바이트)
  str3 BYTE "Hello", 0Dh, 0Ah, 0  ; CR(0Dh)+LF(0Ah) = 줄바꿈
  줄 연속 문자 (\): 소스 두 줄을 하나로 합침 — \뒤에 공백/문자 없어야 함`,
  code:
`.DATA
    ; 정수 리터럴 진법
    dec1    DWORD 26             ; 10진수 (접미사 생략)
    hex1    DWORD 26h            ; 16진수 = 38
    hex2    DWORD 0A3h           ; A로 시작 → 앞에 0 필수
    bin1    DWORD 1101b          ; 2진수 = 13
    negVal  SDWORD -26           ; 부호 있는 정수

    ; 상수 정수 표현식 (어셈블 시간 평가)
    expr1   DWORD 16 * 20        ; = 320
    expr2   DWORD (5 + 3) * 2 - 1 ; = 15
    expr3   DWORD 17 MOD 5       ; = 2

    ; 실수 리터럴
    r4val   REAL4  3.14          ; 단정밀도 4바이트
    r8val   REAL8  2.71828       ; 배정밀도 8바이트
    r4exp   REAL4  3.14E2        ; 지수 표기 = 314.0

    ; 문자 / 문자열
    charA   BYTE   'A'           ; ASCII 41h = 65
    str1    BYTE   "ABCD"        ; 4바이트
    str2    BYTE   "ABCD", 0     ; 5바이트 (널 종료)
    str3    BYTE   "Hello", 0Dh, 0Ah, 0  ; CR+LF+널
    str4    BYTE   "First part ",\
                   "second part", 0      ; 줄 연속 문자`,
  quiz: `☑ 퀴즈: 다음 중 오류인 것은?
  (A) hex DWORD 0FFh
  (B) hex DWORD FFh     ← 오류! F로 시작 → 앞에 0 필수
  (C) hex DWORD 0F0h
  답: (B)`
},
{
  id:"CH3-3", ch:"3장", star:true,
  title:"데이터 타입 & 리틀 엔디안 ★",
  concept:
`내장 데이터 타입:
  BYTE  1B  0~255          SBYTE  1B  -128~127
  WORD  2B  0~65535        SWORD  2B  -32768~32767
  DWORD 4B  0~4294967295   SDWORD 4B  -2147483648~2147483647
  QWORD 8B  64비트         REAL4 4B  REAL8 8B  REAL10 10B

레거시: DB=BYTE  DW=WORD  DD=DWORD/REAL4  DQ=QWORD/REAL8

★ 리틀 엔디안 (Little-Endian) — x86의 다중바이트 저장 방식 ★
  최하위 바이트(LSB)를 가장 낮은 주소에 먼저 저장

  예) DWORD 12345678h 를 주소 100h에 저장:
    주소 100h: 78h  ← LSB (최하위 바이트) 먼저
    주소 101h: 56h
    주소 102h: 34h
    주소 103h: 12h  ← MSB (최상위 바이트) 나중

  예) WORD 0AB12h, 0CD34h 연달아 저장:
    +0: 12h  +1: ABh  +2: 34h  +3: CDh`,
  code:
`.DATA
    ; 기본 변수 선언
    val1     BYTE    10h          ; 1바이트, 값 = 16
    sval     SBYTE   -128         ; 부호 있는 8비트 최솟값
    wval     WORD    1000h        ; 2바이트
    dval     DWORD   12345678h    ; 4바이트 (리틀 엔디안으로 저장)
    undef    DWORD   ?            ; 미초기화

    ; 배열 선언
    byteArr  BYTE    10h, 20h, 30h, 40h, 50h
    wordArr  WORD    100h, 200h, 300h, 400h
    dwordArr DWORD   1000h, 2000h, 3000h

    ; 리틀 엔디안 확인
    ; leDemo = 12345678h → 메모리: [78][56][34][12]
    leDemo   DWORD   12345678h
    leWord1  WORD    0AB12h       ; 메모리: [12][AB]
    leWord2  WORD    0CD34h       ; 메모리: [34][CD]`,
  quiz:
`☑ 퀴즈: DWORD 12345678h 가 주소 200h에 저장될 때
  200h: ?  201h: ?  202h: ?  203h: ?
  답: 200h=78h  201h=56h  202h=34h  203h=12h  (LSB 먼저)

☑ SBYTE 범위: -128 ~ 127  /  BYTE 범위: 0 ~ 255`
},
{
  id:"CH3-4", ch:"3장", star:false,
  title:"DUP 연산자 & .DATA?",
  concept:
`★ DUP 연산자: 횟수 DUP(초기값)
  BYTE  10  DUP(0)           → 0이 10개 (10바이트)
  BYTE   5  DUP(?)           → 미초기화 5바이트
  BYTE   4  DUP(0ABh)        → ABh가 4개
  BYTE   2  DUP(3 DUP(0FFh)) → 중첩 DUP: FF × 6개 (2×3)
  WORD   8  DUP(0)           → WORD 8개 = 16바이트
  DWORD  4  DUP(?)           → DWORD 4개 = 16바이트

★ .DATA?  → 미초기화 전용 세그먼트 (실행 파일 크기 절약)
  .DATA   bigBuf BYTE 10000 DUP(0)  → 파일에 0이 10000바이트 포함 (낭비)
  .DATA?  bigBuf BYTE 10000 DUP(?)  → 크기 정보만 기록 (파일 크기 절약)

★ CR+LF 줄바꿈 패턴:
  welcome BYTE "Welcome!", 0Dh, 0Ah, 0   ; 문자열 + CR + LF + 널`,
  code:
`.DATA
    ; DUP 패턴
    dupA    BYTE    5  DUP(0FFh)    ; FF FF FF FF FF
    zeroBuf BYTE    10 DUP(0)       ; 0이 10개
    undefB  BYTE    5  DUP(?)       ; 미초기화 5바이트
    nested  BYTE    2  DUP(3 DUP(0FFh))  ; FF x 6 (중첩)
    wBuf    WORD    8  DUP(0)       ; WORD 8개 = 16바이트
    dBuf    DWORD   4  DUP(?)       ; DWORD 4개 미초기화

    ; CR+LF 패턴
    welcome BYTE "Welcome!", 0Dh, 0Ah, 0
    result  DWORD ?

.DATA?
    bigBuf  BYTE    4096 DUP(?)     ; 파일 크기에 영향 없음`,
  quiz: null
},
{
  id:"CH3-5", ch:"3장", star:true,
  title:"심볼릭 상수 — = / EQU / TEXTEQU / $ ★",
  concept:
`디렉티브 비교표 (★ 암기 필수):
  =        정수 표현식만  재정의 가능 ✓
  EQU      정수 또는 텍스트  재정의 불가 ✗
  TEXTEQU  텍스트만       재정의 가능 ✓

☑ 퀴즈: COUNT EQU 10 / COUNT EQU 20  → 오류! EQU는 재정의 불가

★ $ 연산자 (현재 위치 카운터):
  list     BYTE  10,20,30,40,50
  ListSize = ($ - list)          ; = 5  (바이트 수)

  wList    WORD  100, 200, 300
  wSize    = ($ - wList) / 2     ; = 3  (TYPE=2 이므로 /2)

  dList    DWORD 1000, 2000, 3000
  dSize    = ($ - dList) / 4     ; = 3  (TYPE=4 이므로 /4)`,
  code:
`; = 디렉티브 (재정의 가능)
COUNT       = 10
LIMIT       = COUNT * 4          ; = 40
LIMIT       = 200                ; 재정의 가능 (합법)

; $ 연산자 (현재 위치 카운터)
list        BYTE    10, 20, 30, 40, 50
ListSize    = ($ - list)         ; = 5
wList       WORD    100, 200, 300
wListSize   = ($ - wList) / 2   ; = 3
dList       DWORD   1000, 2000, 3000
dListSize   = ($ - dList) / 4   ; = 3

; EQU 디렉티브 (재정의 불가)
ROWS        EQU 5
COLS        EQU 10
MATRIX_SIZE EQU ROWS * COLS     ; = 50
PI          EQU <3.14159>
; ROWS EQU 999    ← 이 줄 활성화 시 어셈블 오류!

; TEXTEQU (재정의 가능)
moveVal     TEXTEQU <mov eax>
myMsg       TEXTEQU <"Hello",0>
myMsg       TEXTEQU <"Updated",0>  ; 재정의 가능`,
  quiz:
`☑ 퀴즈: 아래 중 오류 발생하는 줄?
  (A) COUNT = 10  / COUNT = 20        → 합법 (= 재정의 가능)
  (B) SIZE EQU 50 / SIZE EQU 100     → 오류! (EQU 재정의 불가)
  (C) MSG TEXTEQU <"Hi"> / MSG TEXTEQU <"Bye">  → 합법 (TEXTEQU 재정의 가능)`
},
{
  id:"CH4-1", ch:"4장", star:true,
  title:"MOV 규칙 & 겹치는 레지스터 ★",
  concept:
`MOV 규칙 (위반 시 어셈블 오류):
  MOV reg, imm   ✓    MOV reg, reg   ✓    MOV reg, mem   ✓
  MOV mem, reg   ✓    MOV mem, imm   ✓
  MOV mem, mem   ✗ 불가!
  MOV reg(다른크기), reg  ✗ 불가!
  MOV EIP, reg   ✗ 불가! (EIP는 목적지 안 됨)
  MOV DS, imm    ✗ 불가! (세그먼트에 즉치 안 됨)

겹치는 레지스터:
  EAX(32) ⊃ AX(16) ⊃ AH(8 상위) / AL(8 하위)
  작은 서브레지스터를 써도 나머지 비트는 그대로 유지됨!
  예) EAX=12345678h → mov AL, 0AAh → EAX=123456AAh`,
  code:
`.CODE
main PROC
    ; ✓ 올바른 MOV
    mov eax, 10          ; 즉치 → 레지스터
    mov ebx, eax         ; 레지스터 → 레지스터
    mov al, [ebx]        ; 메모리 → 레지스터

`USES 연산자:
  이름 PROC USES reg1 reg2 ...
  → 프로시저 시작 시 자동 PUSH, 종료 시 자동 POP 코드를 어셈블러가 삽입

★★★ USES 함정 ★★★
  반환값 레지스터(보통 EAX)를 USES에 절대 넣으면 안 됨!
  이유: RET 직전에 pop eax가 자동 삽입되어 반환값을 덮어씀!

  Bad: ArraySum PROC USES esi ecx eax
    → ret 직전에 pop eax 삽입 → EAX(반환값) 파괴됨!
  Good: ArraySum PROC USES esi ecx
    → EAX는 USES에 없으므로 반환값 유지됨

  code:
`; ArraySum (수동 PUSH/POP)
; Receives: ESI = 배열 주소, ECX = 원소 개수
; Returns:  EAX = 합계
ArraySum PROC
    push esi               ; 호출자 ESI 보존
    push ecx               ; 호출자 ECX 보존
    mov  eax, 0            ; 합 초기화
sumL:
    add  eax, [esi]        ; EAX += 현재 원소
    add  esi, 4            ; 다음 DWORD
    loop sumL              ; ECX-- 반복
    pop  ecx               ; ECX 복원 (역순!)
    pop  esi               ; ESI 복원
    ret
ArraySum ENDP

; ArraySumUSES (USES로 자동 보존, 동일 동작)
ArraySumUSES PROC USES esi ecx
    ; ★ EAX는 반환값이므로 USES에서 제외!
    mov  eax, 0
sumLU:
    add  eax, [esi]
    add  esi, 4
    loop sumLU
    ret                    ; pop ecx / pop esi 자동 삽입 후 복귀

// ─────────────────────────────────────────────────────────────────
// 상태
// ─────────────────────────────────────────────────────────────────
let currentIdx = -1;
let done = new Set(JSON.parse(localStorage.getItem('asm_done') || '[]'));
let refVisible = true;

// ─────────────────────────────────────────────────────────────────
// 사이드바 렌더링
// ─────────────────────────────────────────────────────────────────
function buildSidebar() {
  const list = document.getElementById('sec-list');
  list.innerHTML = '';
  let ch = '';
  SECTIONS.forEach((s, i) => {
    if (s.ch !== ch) {
      ch = s.ch;
      const lbl = document.createElement('div');
      lbl.className = 'ch-label';
      lbl.textContent = ch;
      list.appendChild(lbl);
    }
    const btn = document.createElement('button');
    btn.className = 'sec-btn' + (done.has(s.id) ? ' done' : '');
    btn.dataset.idx = i;
    btn.innerHTML = s.star
      ? `<span class="star">★</span> ${s.id}: ${s.title}`
      : `${s.id}: ${s.title}`;
    btn.title = s.title;
    btn.onclick = () => loadSection(i);
    list.appendChild(btn);
  });
  updateProgress();
}

function updateProgress() {
  const total = SECTIONS.length;
  const cnt = SECTIONS.filter(s => done.has(s.id)).length;
  document.getElementById('prog-text').textContent = `${cnt} / ${total} 완료`;
  document.getElementById('progress-fill').style.width = `${(cnt/total)*100}%`;
  document.querySelectorAll('.sec-btn').forEach((btn, i) => {
    btn.className = 'sec-btn'
      + (i === currentIdx ? ' active' : '')
      + (done.has(SECTIONS[i].id) ? ' done' : '');
  });
}

// ─────────────────────────────────────────────────────────────────
// 섹션 로드
// ─────────────────────────────────────────────────────────────────
function loadSection(idx) {
  currentIdx = idx;
  const s = SECTIONS[idx];

  document.getElementById('sec-title').textContent = `${s.id}: ${s.title}`;
  const bch = document.getElementById('badge-ch');
  bch.textContent = s.ch;
  bch.style.display = '';
  const bstar = document.getElementById('badge-star');
  bstar.style.display = s.star ? '' : 'none';

  document.getElementById('concept-box').textContent = s.concept;
  document.getElementById('ref-code').textContent = s.code;

  const qbox = document.getElementById('quiz-box');
  if (s.quiz) { qbox.textContent = s.quiz; qbox.style.display = ''; }
  else { qbox.style.display = 'none'; }

  document.getElementById('typing').value = '';
  document.getElementById('diff-box').style.display = 'none';
  document.getElementById('diff-box').innerHTML = '';
  document.getElementById('match-disp').textContent = '0%';
  document.getElementById('char-disp').textContent = `0 / ${s.code.length} 자`;

  // 참고 코드 기본 보이기
  if (!refVisible) toggleRef();

  updateProgress();
  document.getElementById('typing').focus();
}

// ─────────────────────────────────────────────────────────────────
// 참고 코드 토글
// ─────────────────────────────────────────────────────────────────
function toggleRef() {
  refVisible = !refVisible;
  const wrap = document.getElementById('ref-wrap');
  const btn = document.getElementById('tog-ref');
  wrap.style.display = refVisible ? '' : 'none';
  btn.textContent = refVisible ? '숨기기' : '보이기';
}

// ─────────────────────────────────────────────────────────────────
// 타이핑 실시간 반영
// ─────────────────────────────────────────────────────────────────
function onType() {
  if (currentIdx < 0) return;
  const ref = SECTIONS[currentIdx].code;
  const typed = document.getElementById('typing').value;
  const match = calcMatch(ref, typed);
  document.getElementById('match-disp').textContent = match + '%';
  document.getElementById('char-disp').textContent = `${typed.length} / ${ref.length} 자`;
  if (match >= 95) {
    document.getElementById('match-disp').style.color = '#4ec94e';
  } else if (match >= 70) {
    document.getElementById('match-disp').style.color = '#f1c40f';
  } else {
    document.getElementById('match-disp').style.color = '#ff6b6b';
  }
}

function calcMatch(ref, typed) {
  if (!typed.length) return 0;
  let ok = 0;
  const len = Math.min(ref.length, typed.length);
  for (let i = 0; i < len; i++) {
    if (ref[i] === typed[i]) ok++;
  }
  return Math.round((ok / ref.length) * 100);
}

// ─────────────────────────────────────────────────────────────────
// 비교
// ─────────────────────────────────────────────────────────────────
function checkDiff() {
  if (currentIdx < 0) return;
  const ref = SECTIONS[currentIdx].code;
  const typed = document.getElementById('typing').value;
  const box = document.getElementById('diff-box');
  box.innerHTML = '';
  box.style.display = '';

  const maxLen = Math.max(ref.length, typed.length);
  let html = '';
  for (let i = 0; i < maxLen; i++) {
    const r = ref[i];
    const t = typed[i];
    if (r === undefined) {
      // 타이핑이 ref보다 길다 (불필요한 문자)
      html += `<span class="d-err">${esc(t)}</span>`;
    } else if (t === undefined) {
      // 미입력 부분
      html += `<span class="d-mis">${esc(r)}</span>`;
    } else if (r === t) {
      html += `<span class="d-ok">${esc(r)}</span>`;
    } else {
      html += `<span class="d-err">${esc(t)}</span>`;
    }
  }
  box.innerHTML = html;
  box.scrollTop = 0;
}

function esc(c) {
  if (c === '<') return '&lt;';
  if (c === '>') return '&gt;';
  if (c === '&') return '&amp;';
  if (c === '\n') return '\n';
  return c;
}

// ─────────────────────────────────────────────────────────────────
// 리셋 / 완료
// ─────────────────────────────────────────────────────────────────
function resetTyping() {
  document.getElementById('typing').value = '';
  document.getElementById('diff-box').style.display = 'none';
  document.getElementById('diff-box').innerHTML = '';
  document.getElementById('match-disp').textContent = '0%';
  document.getElementById('match-disp').style.color = '#4ec94e';
  if (currentIdx >= 0)
    document.getElementById('char-disp').textContent =
      `0 / ${SECTIONS[currentIdx].code.length} 자`;
  document.getElementById('typing').focus();
}

function markDone() {
  if (currentIdx < 0) return;
  const id = SECTIONS[currentIdx].id;
  done.add(id);
  localStorage.setItem('asm_done', JSON.stringify([...done]));
  updateProgress();
}

// ─────────────────────────────────────────────────────────────────
// 이전/다음
// ─────────────────────────────────────────────────────────────────
function navigate(dir) {
  const next = currentIdx + dir;
  if (next >= 0 && next < SECTIONS.length) loadSection(next);
}

// Tab 키 → 4칸 들여쓰기
document.getElementById('typing').addEventListener('keydown', function(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = this.selectionStart;
    const e2 = this.selectionEnd;
    this.value = this.value.slice(0, s) + '    ' + this.value.slice(e2);
    this.selectionStart = this.selectionEnd = s + 4;
    onType();
  }
});

// ─────────────────────────────────────────────────────────────────
// 초기화
// ─────────────────────────────────────────────────────────────────
buildSidebar();
loadSection(0);
</script>
