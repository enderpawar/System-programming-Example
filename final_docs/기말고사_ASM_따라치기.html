const UI = {unchecked:'미채점', correct:'정답', wrong:'확인 필요', prompt:'문제', mine:'내 풀이', answer:'정답', copyPrompt:'문제 복사', loadAnswer:'정답을 입력창에 넣기', check:'채점', show:'정답 보기', hide:'정답 숨기기', copyAnswer:'정답 복사', clear:'비우기', placeholder:'여기에 MASM 코드나 답을 직접 따라 치세요.', guide:'입력 후 채점하면 앞뒤 공백을 제거해 비교합니다.', ok:'정답과 일치합니다.', bad:'정답과 다릅니다. 아래 차이를 보고 누락된 줄이나 명령어를 확인하세요.', noAnswer:'정답 없음'};
const storeKey='sp-final-asm-typing-v1';
const saved=JSON.parse(localStorage.getItem(storeKey)||'{}');
const app=document.getElementById('app'),toc=document.getElementById('toc'),statusEl=document.getElementById('status'),progressFill=document.getElementById('progressFill');
const escapeHtml=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const normalize=s=>String(s).replace(/\r\n/g,'\n').trim();
const makeId=(si,pi)=>'s'+si+'-p'+pi;
function render(){let total=0;DATA.forEach((set,si)=>{const sectionId='set-'+si;const link=document.createElement('a');link.href='#'+sectionId;link.textContent=set.source;toc.appendChild(link);const h2=document.createElement('h2');h2.className='set-title';h2.id=sectionId;h2.textContent=set.source;app.appendChild(h2);const intro=document.createElement('pre');intro.className='intro code';intro.textContent=set.intro;app.appendChild(intro);set.problems.forEach(problem=>{total++;const id=makeId(si,problem.id);const card=document.createElement('article');card.className='card';card.id=id;card.innerHTML='<div class="card-head"><h3>'+escapeHtml(problem.title)+'</h3><span class="badge" data-badge>'+UI.unchecked+'</span></div><div class="workspace"><section class="pane"><div class="pane-title"><span>'+UI.prompt+'</span><button class="ghost" data-copy-prompt>'+UI.copyPrompt+'</button></div><pre class="code">'+escapeHtml(problem.prompt)+'</pre></section><section class="pane"><div class="pane-title"><span>'+UI.mine+'</span><button class="ghost" data-load-answer>'+UI.loadAnswer+'</button></div><textarea class="editor" spellcheck="false" placeholder="'+UI.placeholder+'"></textarea><div class="tools"><button class="primary" data-check>'+UI.check+'</button><button data-toggle>'+UI.show+'</button><button class="ghost" data-copy-answer>'+UI.copyAnswer+'</button><button class="ghost" data-clear>'+UI.clear+'</button></div><div class="result" data-result>'+UI.guide+'</div><pre class="code answer" data-answer>'+escapeHtml(problem.answer||UI.noAnswer)+'</pre></section></div>';const editor=card.querySelector('.editor');editor.value=saved[id]||'';editor.addEventListener('input',()=>{saved[id]=editor.value;localStorage.setItem(storeKey,JSON.stringify(saved));updateProgress()});card.querySelector('[data-toggle]').addEventListener('click',e=>{const ans=card.querySelector('[data-answer]');ans.classList.toggle('open');e.currentTarget.textContent=ans.classList.contains('open')?UI.hide:UI.show});card.querySelector('[data-check]').addEventListener('click',()=>checkCard(card,problem.answer));card.querySelector('[data-clear]').addEventListener('click',()=>{editor.value='';saved[id]='';localStorage.setItem(storeKey,JSON.stringify(saved));setResult(card,UI.guide,'');updateProgress()});card.querySelector('[data-copy-answer]').addEventListener('click',()=>navigator.clipboard.writeText(problem.answer||''));card.querySelector('[data-copy-prompt]').addEventListener('click',()=>navigator.clipboard.writeText(problem.prompt||''));card.querySelector('[data-load-answer]').addEventListener('click',()=>{editor.value=problem.answer||'';editor.dispatchEvent(new Event('input'))});app.appendChild(card)})});app.dataset.total=total;updateProgress()}
function setResult(card,msg,cls,diff=''){const result=card.querySelector('[data-result]');result.className='result'+(cls?' '+cls:'');result.innerHTML=escapeHtml(msg)+(diff?'<div class="diff">'+diff+'</div>':'');card.querySelector('[data-badge]').textContent=cls==='good'?UI.correct:cls==='bad'?UI.wrong:UI.unchecked}
function checkCard(card,answer){const mine=card.querySelector('.editor').value;const ok=normalize(mine)===normalize(answer||'');if(ok)setResult(card,UI.ok,'good');else setResult(card,UI.bad,'bad',simpleDiff(normalize(mine),normalize(answer||'')));updateProgress()}
function simpleDiff(a,b){const al=a.split('\n'),bl=b.split('\n'),max=Math.max(al.length,bl.length),out=[];for(let i=0;i<max;i++){if((al[i]||'')===(bl[i]||''))out.push('  '+(al[i]||''));else{if(al[i])out.push('<del>- '+escapeHtml(al[i])+'</del>');if(bl[i])out.push('<ins>+ '+escapeHtml(bl[i])+'</ins>')}}return out.slice(0,80).join('\n')+(out.length>80?'\n... 차이가 길어 앞 80줄만 표시':'')}
function updateProgress(){const editors=[...document.querySelectorAll('.editor')];const done=editors.filter(e=>e.value.trim()).length;const total=Number(app.dataset.total||editors.length||0);statusEl.textContent=done+' / '+total+' 입력';progressFill.style.width=total?Math.round(done/total*100)+'%':'0%'}
document.getElementById('checkAll').addEventListener('click',()=>DATA.forEach((set,si)=>set.problems.forEach(p=>checkCard(document.getElementById(makeId(si,p.id)),p.answer))));
document.getElementById('showAll').addEventListener('click',()=>document.querySelectorAll('[data-answer]').forEach(e=>e.classList.add('open')));
document.getElementById('hideAll').addEventListener('click',()=>document.querySelectorAll('[data-answer]').forEach(e=>e.classList.remove('open')));
document.getElementById('clearAll').addEventListener('click',()=>{if(!confirm('모든 입력을 지울까요?'))return;localStorage.removeItem(storeKey);Object.keys(saved).forEach(k=>delete saved[k]);document.querySelectorAll('.editor').forEach(e=>e.value='');document.querySelectorAll('.card').forEach(c=>setResult(c,UI.guide,''));updateProgress()});
render();
